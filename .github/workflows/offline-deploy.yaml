name: Offline Deploy Build

on:
  workflow_dispatch:

env:
  DEERFLOW_ROOT: /opt/deerflow

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage source at fixed path
        run: |
          sudo mkdir -p "$DEERFLOW_ROOT"
          sudo chown "$(id -un):$(id -gn)" "$DEERFLOW_ROOT"
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" "$DEERFLOW_ROOT/deer-flow/"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync backend Python 3.12 environment
        run: |
          export UV_PYTHON_INSTALL_DIR="$DEERFLOW_ROOT/python"
          cd "$DEERFLOW_ROOT/deer-flow/backend"
          ~/.local/bin/uv sync --locked --all-packages --python 3.12
          .venv/bin/python --version

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle Node runtime
        run: |
          NODE_DIR="$(dirname "$(dirname "$(readlink -f "$(which node)")")")"
          cp -a "$NODE_DIR" "$DEERFLOW_ROOT/node"
          "$DEERFLOW_ROOT/node/bin/node" --version

      - name: Build frontend (production)
        run: |
          cd "$DEERFLOW_ROOT/deer-flow/frontend"
          corepack enable
          pnpm install --frozen-lockfile
          SKIP_ENV_VALIDATION=1 pnpm build
          pnpm prune --prod

      - name: Configure for offline host-process deploy
        run: |
          cd "$DEERFLOW_ROOT/deer-flow"
          cp config.example.yaml config.yaml
          python3 - <<'EOF'
          p = "config.yaml"
          s = open(p, encoding="utf-8").read()
          s = s.replace(
              "sandbox:\n  use: deerflow.sandbox.local:LocalSandboxProvider",
              "sandbox:\n  use: deerflow.community.aio_sandbox:AioSandboxProvider\n"
              "  image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0",
          )
          open(p, "w", encoding="utf-8").write(s)
          EOF
          printf '{\n  "middlewares": [],\n  "mcpInterceptors": [],\n  "mcpServers": {}\n}\n' > extensions_config.json

      - name: Generate host-mode nginx config
        run: |
          cd "$DEERFLOW_ROOT/deer-flow"
          sed -e 's|set $gateway_upstream gateway:8001;|set $gateway_upstream 127.0.0.1:8001;|' \
              -e 's|set $frontend_upstream frontend:3000;|set $frontend_upstream 127.0.0.1:3000;|' \
              -e 's|set $provisioner_upstream provisioner:8002;|set $provisioner_upstream 127.0.0.1:8002;|' \
              -e 's|resolver 127.0.0.11|resolver 127.0.0.1|' \
              -e '/listen \[::\]:2026/d' \
              docker/nginx/nginx.conf > docker/nginx/nginx-host.conf
          grep -n "upstream" docker/nginx/nginx-host.conf | head -5

      - name: Write start/stop scripts
        run: |
          cat > "$DEERFLOW_ROOT/deer-flow/start-offline.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT=/opt/deerflow
          DF="$ROOT/deer-flow"
          LOGS="$DF/logs"
          mkdir -p "$LOGS" "$DF/backend/.deer-flow" "$DF/backend/sandbox" "$DF/temp"

          if [ ! -f "$ROOT/.env" ]; then
            umask 077
            cat > "$ROOT/.env" <<ENVEOF
          BETTER_AUTH_SECRET=$(openssl rand -hex 16)
          DEER_FLOW_INTERNAL_AUTH_TOKEN=$(openssl rand -hex 16)
          ENVEOF
          fi
          # shellcheck disable=SC1091
          set -a; . "$ROOT/.env"; set +a
          export DEER_FLOW_PROJECT_ROOT="$DF"
          export DEER_FLOW_HOME="$DF/backend/.deer-flow"
          export DEER_FLOW_CONFIG_PATH="$DF/config.yaml"
          export DEER_FLOW_EXTENSIONS_CONFIG_PATH="$DF/extensions_config.json"
          export DEER_FLOW_STREAM_BRIDGE_REDIS_URL=redis://127.0.0.1:6379/0
          export DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://127.0.0.1:8001/api
          export DEER_FLOW_CHANNELS_GATEWAY_URL=http://127.0.0.1:8001
          export AUTH_TRUSTED_PROXIES=127.0.0.1
          export DEER_FLOW_HOST_BASE_DIR="$DF"

          echo "[1/4] redis..."
          docker start deer-flow-redis 2>/dev/null || \
            docker run -d --name deer-flow-redis --network host --restart unless-stopped redis:7-alpine

          echo "[2/4] nginx..."
          docker start deer-flow-nginx 2>/dev/null || \
            docker run -d --name deer-flow-nginx --network host --restart unless-stopped \
              -v "$DF/docker/nginx/nginx-host.conf:/etc/nginx/nginx.conf:ro" nginx:1.31.2-alpine

          echo "[3/4] gateway..."
          cd "$DF/backend"
          nohup env PYTHONPATH=. "$DF/backend/.venv/bin/python" -m uvicorn app.gateway.app:app \
            --host 127.0.0.1 --port 8001 > "$LOGS/gateway.log" 2>&1 &
          echo $! > "$LOGS/gateway.pid"

          echo "[4/4] frontend..."
          cd "$DF/frontend"
          nohup env PORT=3000 "$ROOT/node/bin/node" node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000 > "$LOGS/frontend.log" 2>&1 &
          echo $! > "$LOGS/frontend.pid"

          sleep 8
          echo ""
          echo "gateway  pid $(cat "$LOGS/gateway.pid")  -> http://127.0.0.1:8001/health"
          echo "frontend pid $(cat "$LOGS/frontend.pid") -> http://127.0.0.1:3000"
          echo "entry: http://<server-ip>:2026   logs: $LOGS/{gateway,frontend}.log"
          SCRIPT

          cat > "$DEERFLOW_ROOT/deer-flow/stop-offline.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          LOGS=/opt/deerflow/deer-flow/logs
          for f in gateway frontend; do
            if [ -f "$LOGS/$f.pid" ]; then
              kill "$(cat "$LOGS/$f.pid")" 2>/dev/null || true
              rm -f "$LOGS/$f.pid"
            fi
          done
          docker stop deer-flow-nginx deer-flow-redis 2>/dev/null || true
          echo "stopped."
          SCRIPT

          chmod +x "$DEERFLOW_ROOT/deer-flow/start-offline.sh" "$DEERFLOW_ROOT/deer-flow/stop-offline.sh"
          bash -n "$DEERFLOW_ROOT/deer-flow/start-offline.sh"
          bash -n "$DEERFLOW_ROOT/deer-flow/stop-offline.sh"

      - name: Pull infrastructure images
        run: |
          docker pull redis:7-alpine
          docker pull nginx:1.31.2-alpine
          docker pull enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0

      - name: Pack artifacts (split parts)
        run: |
          mkdir -p out-images out-runtime
          docker save \
            redis:7-alpine \
            nginx:1.31.2-alpine \
            enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0 \
            | split -b 1900m - out-images/deerflow-images.part.
          tar -czf - -C /opt deerflow | split -b 1900m - out-runtime/deerflow-runtime.part.
          ls -lh out-images out-runtime

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: deerflow-images
          path: out-images/
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: deerflow-runtime
          path: out-runtime/
          if-no-files-found: error
          retention-days: 7
