name: Offline Deploy Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure runtime files
        run: |
          cp config.example.yaml config.yaml
          python3 - <<'EOF'
          p = "config.yaml"
          s = open(p, encoding="utf-8").read()
          old = "sandbox:\n  use: deerflow.sandbox.local:LocalSandboxProvider"
          new = ("sandbox:\n  use: deerflow.community.aio_sandbox:AioSandboxProvider\n"
                 "  image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0")
          assert old in s, "sandbox block not found in config.example.yaml"
          open(p, "w", encoding="utf-8").write(s.replace(old, new))
          print("sandbox provider -> AioSandboxProvider + sandbox image pinned")
          EOF
          grep -n "AioSandboxProvider" config.yaml | head -2
          printf '{\n  "middlewares": [],\n  "mcpInterceptors": [],\n  "mcpServers": {}\n}\n' > extensions_config.json
          printf 'registry=http://172.16.13.24/repository/npm/\n' > frontend/.npmrc
          sed -e 's|set $gateway_upstream gateway:8001;|set $gateway_upstream 127.0.0.1:8001;|' \
              -e 's|set $frontend_upstream frontend:3000;|set $frontend_upstream 127.0.0.1:3000;|' \
              -e 's|set $provisioner_upstream provisioner:8002;|set $provisioner_upstream 127.0.0.1:8002;|' \
              -e 's|resolver 127.0.0.11|resolver 127.0.0.1|' \
              -e '/listen \[::\]:2026/d' \
              docker/nginx/nginx.conf > docker/nginx/nginx-host.conf
          grep -q 'set $gateway_upstream 127.0.0.1:8001;' docker/nginx/nginx-host.conf
          grep -q 'set $frontend_upstream 127.0.0.1:3000;' docker/nginx/nginx-host.conf
          echo "nginx host config ready"

      - name: Write compose file and scripts
        run: |
          mkdir -p scripts-offline

          cat > docker/docker-compose.offline.yaml <<'YAML'
          services:
            redis:
              image: redis:7-alpine
              container_name: deerflow-redis
              network_mode: host
              command: ["redis-server", "--appendonly", "yes", "--bind", "127.0.0.1"]
              volumes:
                - /opt/deerflow/redis-data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 3s
                retries: 30
              restart: unless-stopped

            nginx:
              image: nginx:1.31.2-alpine
              container_name: deerflow-nginx
              network_mode: host
              volumes:
                - /opt/deerflow/deer-flow/docker/nginx/nginx-host.conf:/etc/nginx/nginx.conf:ro
              restart: unless-stopped

            backend:
              image: python:3.12-bookworm
              container_name: deerflow-backend
              network_mode: host
              init: true
              stop_grace_period: 90s
              working_dir: /opt/deerflow/deer-flow/backend
              volumes:
                - /opt/deerflow/deer-flow:/opt/deerflow/deer-flow
                - /var/run/docker.sock:/var/run/docker.sock
              env_file:
                - /opt/deerflow/.env
              environment:
                - CI=true
                - PIP_INDEX_URL=http://172.16.13.24/repository/pypi-proxy-aliyun/simple
                - UV_DEFAULT_INDEX=http://172.16.13.24/repository/pypi-proxy-aliyun/simple
                - UV_PYTHON_DOWNLOADS=never
                - DEER_FLOW_PROJECT_ROOT=/opt/deerflow/deer-flow
                - DEER_FLOW_HOME=/opt/deerflow/deer-flow/backend/.deer-flow
                - DEER_FLOW_CONFIG_PATH=/opt/deerflow/deer-flow/config.yaml
                - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/opt/deerflow/deer-flow/extensions_config.json
                - DEER_FLOW_STREAM_BRIDGE_REDIS_URL=redis://127.0.0.1:6379/0
                - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://127.0.0.1:8001/api
                - DEER_FLOW_CHANNELS_GATEWAY_URL=http://127.0.0.1:8001
                - DEER_FLOW_HOST_BASE_DIR=/opt/deerflow/deer-flow/backend/.deer-flow
                - DEER_FLOW_SANDBOX_HOST=172.17.0.1
                - DEER_FLOW_DOCKER_SOCKET=/var/run/docker.sock
                - AUTH_TRUSTED_PROXIES=127.0.0.1
              command: ["bash", "/opt/deerflow/deer-flow/scripts-offline/backend-run.sh"]
              depends_on:
                redis:
                  condition: service_healthy
              restart: unless-stopped

            frontend:
              image: node:22-bookworm
              container_name: deerflow-frontend
              network_mode: host
              working_dir: /opt/deerflow/deer-flow/frontend
              volumes:
                - /opt/deerflow/deer-flow:/opt/deerflow/deer-flow
              env_file:
                - /opt/deerflow/.env
              environment:
                - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://127.0.0.1:8001
                - COREPACK_NPM_REGISTRY=http://172.16.13.24/repository/npm/
                - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
                - npm_config_registry=http://172.16.13.24/repository/npm/
              command: ["bash", "/opt/deerflow/deer-flow/scripts-offline/frontend-run.sh"]
              restart: unless-stopped
          YAML

          cat > scripts-offline/backend-run.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DF=/opt/deerflow/deer-flow
          cd "$DF/backend"
          if [ ! -x .venv/bin/python ]; then
            echo "[backend] first boot: installing Python environment from pypi proxy (5-15 min)..."
            pip install --no-cache-dir --quiet uv
            uv sync --locked --all-packages
          fi
          echo "[backend] starting gateway on 0.0.0.0:8001"
          exec env PYTHONPATH=. .venv/bin/python -m uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001
          SH

          cat > scripts-offline/frontend-run.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DF=/opt/deerflow/deer-flow
          cd "$DF/frontend"
          if [ ! -e node_modules/next ]; then
            echo "[frontend] first boot: installing dependencies + building from npm proxy (10-25 min)..."
            corepack enable
            pnpm --version
            pnpm install --frozen-lockfile
            SKIP_ENV_VALIDATION=1 pnpm build
          fi
          echo "[frontend] starting on 127.0.0.1:3000"
          exec node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 3000
          SH

          cat > scripts-offline/start-offline.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT=/opt/deerflow
          DF="$ROOT/deer-flow"

          gen_hex() {
            openssl rand -hex 16 2>/dev/null || \
              docker run --rm python:3.12-bookworm python -c "import secrets; print(secrets.token_hex(16))"
          }

          if [ ! -f "$ROOT/.env" ]; then
            umask 077
            cat > "$ROOT/.env" <<ENVEOF
          BETTER_AUTH_SECRET=$(gen_hex)
          DEER_FLOW_INTERNAL_AUTH_TOKEN=$(gen_hex)
          ENVEOF
            echo "[env] generated $ROOT/.env"
          fi

          mkdir -p "$ROOT/redis-data" "$DF/backend/.deer-flow" "$DF/logs"

          docker compose -f "$DF/docker/docker-compose.offline.yaml" up -d

          echo ""
          echo "started."
          echo "  entry:      http://<server-ip>:2026"
          echo "  first boot: backend installs Python env; frontend installs deps + builds"
          echo "  progress:   docker logs -f deerflow-backend"
          echo "              docker logs -f deerflow-frontend"
          SH

          cat > scripts-offline/stop-offline.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          docker compose -f /opt/deerflow/deer-flow/docker/docker-compose.offline.yaml down
          echo "stopped."
          SH

          cat > scripts-offline/build-frontend.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          docker exec deerflow-frontend bash -c "cd /opt/deerflow/deer-flow/frontend && SKIP_ENV_VALIDATION=1 pnpm build"
          docker restart deerflow-frontend
          echo "[done] frontend rebuilt and restarted"
          SH

          cat > DEPLOY.md <<'MD'
          # DeerFlow Offline Deploy Runbook

          Add `sudo` before docker commands if permission denied.

          ## One-time setup
          1. Load images:
                  cat deerflow-images.part.* | docker load
          2. Unpack runtime:
                  sudo mkdir -p /opt/deerflow
                  sudo chown "$(id -un):$(id -gn)" /opt/deerflow
                  mkdir -p /opt/deerflow/deer-flow
                  tar -xzf deerflow-runtime.tar.gz -C /opt/deerflow/deer-flow
          3. Start:
                  cd /opt/deerflow/deer-flow
                  ./scripts-offline/start-offline.sh
             First boot takes 10-30 min (backend installs Python env; frontend
             installs deps and builds). Watch progress:
                  docker logs -f deerflow-backend
                  docker logs -f deerflow-frontend
          4. Configure models (required): edit /opt/deerflow/deer-flow/config.yaml
             models section -> point at an LLM endpoint reachable from this server,
             then: docker restart deerflow-backend
          5. Open http://<server-ip>:2026

          ## Daily iteration
          - Backend code change: replace files under backend/, then:
                docker restart deerflow-backend
          - Frontend code change: replace files under frontend/, then:
                ./scripts-offline/build-frontend.sh
          - Add python package (into backend venv):
                docker exec -it deerflow-backend bash -c "cd backend && uv pip install <package>"
          - Add npm package:
                docker exec -it deerflow-frontend pnpm add <package>
          - Reset python env: rm -rf backend/.venv && docker restart deerflow-backend
          - Reset frontend deps: rm -rf frontend/node_modules && docker restart deerflow-frontend

          ## Lifecycle
          - Stop:  ./scripts-offline/stop-offline.sh
          - Start: ./scripts-offline/start-offline.sh
          MD

          chmod +x scripts-offline/*.sh
          bash -n scripts-offline/backend-run.sh
          bash -n scripts-offline/frontend-run.sh
          bash -n scripts-offline/start-offline.sh
          bash -n scripts-offline/stop-offline.sh
          bash -n scripts-offline/build-frontend.sh
          sudo mkdir -p /opt/deerflow && sudo touch /opt/deerflow/.env
          docker compose -f docker/docker-compose.offline.yaml config --quiet && echo "compose file valid"

      - name: Pack runtime artifact (source + offline scripts)
        run: |
          tar -czf /tmp/deerflow-runtime.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
          ls -lh /tmp/deerflow-runtime.tar.gz

      - name: Pull images
        run: |
          docker pull python:3.12-bookworm
          docker pull node:22-bookworm
          docker pull redis:7-alpine
          docker pull nginx:1.31.2-alpine
          docker pull enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0

      - name: Pack images artifact (split parts)
        run: |
          mkdir -p out-images
          docker save python:3.12-bookworm node:22-bookworm redis:7-alpine nginx:1.31.2-alpine \
            enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0 \
            | split -b 1900m - out-images/deerflow-images.part.
          ls -lh out-images/

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: deerflow-images
          path: out-images/
          if-no-files-found: error
          retention-days: 7

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: deerflow-runtime
          path: /tmp/deerflow-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
